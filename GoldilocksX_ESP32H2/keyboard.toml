# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "GoldilocksX ESP32H2"
product_name = "GoldilocksX"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "esp32h2"

[split]
# split connection type
connection = "ble"

# Split central
[split.central]
# Central's matrix definition and offsets
rows = 7
cols = 7
row_offset = 0
col_offset = 0

# Central's matrix
[split.central.matrix]
# Define matrix pins, scanning matrix is 7 rows, 7 cols:
#
# Have 15 physically available pins are:
# Left top: GPIO24, 25, 0, 1, 2, 3, 4, 5, GPIO8 (also RGB)
# Right top: 5V, GND, 3V3, GPIO14, 13 (also LED), 12, 11, 10, 9
#
# Trying to use all except the RGB LED on GPIO8.
row_pins = ["GPIO24", "GPIO25", "GPIO0", "GPIO1", "GPIO2", "GPIO3", "GPIO4"]
col_pins = ["GPIO5", "GPIO14", "GPIO13", "GPIO12", "GPIO11", "GPIO10", "GPIO9"]

# Note there're TWO brackets, since the peripheral is a list
# Peripheral 0
[[split.peripheral]]
# Matrix definition
rows = 7
cols = 7
row_offset = 0
col_offset = 7

# Peripheral 0's matrix definition
[split.peripheral.matrix]
# Define matrix pins, scanning matrix is 7 rows, 7 cols:
# Real wiring or right likely to differ from the left half
row_pins = ["GPIO24", "GPIO25", "GPIO0", "GPIO1", "GPIO2", "GPIO3", "GPIO4"]
col_pins = ["GPIO5", "GPIO14", "GPIO13", "GPIO12", "GPIO11", "GPIO10", "GPIO9"]

[layout]
# Physical layout is matrix of 4 rows, 10 cols
# Logically each half uses 7x7, with offset combined is 7x14.
# Each 7x7 follows House of Graphs #56116, circle of 14 with two crossings (thumb keys)
rows = 7
cols = 14
map = """
(0, 0, L)  (1, 2, L)  (3, 3, L)  (4, 5, L)  (6, 6, L)    (6, 13, R)  (4, 12, R)  (3, 10, R)   (1, 9, R)  (0, 7, R)
(0, 1, L)  (2, 2, L)  (3, 4, L)  (5, 5, L)  (6, 0, L)     (6, 7, R)  (5, 12, R)  (3, 11, R)   (2, 9, R)  (0, 8, R)
(1, 1, L)  (2, 3, L)  (4, 4, L)  (5, 6, L)  (0, 3, L)    (0, 10, R)  (5, 13, R)  (4, 11, R)  (2, 10, R)  (1, 8, R)
                                            (5, 1, L)    (5, 11, R)
"""

[keymap]
layers = 6

[[keymap.layer]]
name = "base_layer"
keys = """
Q W E R T Y U I O P
A S D F G H J K L Semicolon
Z X C V B N M Comma Dot Slash
   LShift Space
"""

[host]
# Vial Unlock combination: simultaneous press of specified keys
unlock_keys = [[0, 0], [0, 4]]  # Q and T (top corners of left half)
